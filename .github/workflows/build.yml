name: Build profile

# Rebuilds the images and README.md from profile.toml, and refreshes each project's CI light.
# A commit is made only when something actually changed.

on:
  push:
    branches: [main]
    paths: [profile.toml, build.py, details.md, .github/workflows/build.yml]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py --live
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild profile" && git push)
